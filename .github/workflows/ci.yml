name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (PHIA data is not distributed, so its tests skip)
        run: python -m pytest --strict-markers
      - name: Benchmark reproduces BENCHMARK.md
        run: |
          python -m pulseeval --benchmark > "$RUNNER_TEMP/benchmark.md"
          diff <(tr -d '\r' < BENCHMARK.md) "$RUNNER_TEMP/benchmark.md"
